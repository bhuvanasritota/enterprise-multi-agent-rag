name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && ruff check app tests
      - run: cd backend && pytest -q
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          JWT_SECRET: ci-only-secret
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package.json}
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
